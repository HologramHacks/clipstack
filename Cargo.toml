[package]
name = "clipstack"
version = "0.1.0"
edition = "2021"
description = "Tiny clipboard history popup triggered by middle-click"

[dependencies]
arboard = "3"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_Security_Cryptography",
    "Win32_UI_HiDpi",
]

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
