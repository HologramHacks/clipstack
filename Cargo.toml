[package]
name = "clipstack"
version = "0.6.1"
edition = "2021"
description = "Tiny clipboard history popup for Windows (configurable trigger)"
license = "MIT"
repository = "https://github.com/HologramHacks/clipstack"
authors = ["Brian Jones"]

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Kernel",
    "Win32_System_Registry",
    "Win32_Security_Cryptography",
    "Win32_UI_HiDpi",
]

# Experimental macOS port (src/mac.rs): compile-verified on CI only so far.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
