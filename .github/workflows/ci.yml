name: CI

on:
  push:
    # feat/macos-experimental is listed so the port branch gets CI without a
    # PR; drop it here when the branch merges or dies.
    branches: [main, feat/macos-experimental]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & clippy (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build (release)
        run: cargo build --release --verbose
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Tests
        run: cargo test --verbose

  # The release exe is built locally with the GNU toolchain, but the job above
  # uses MSVC, so an MSVC-green dependency can still be unbuildable locally
  # (this bit us with windows-sys 0.61 / dlltool). This job mirrors the local
  # toolchain so that class of breakage shows up in CI.
  build-gnu:
    name: Build (GNU toolchain)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable-x86_64-pc-windows-gnu
      - name: Build (release)
        run: cargo build --release --verbose
      - name: Tests
        run: cargo test --verbose

  # Experimental macOS port (src/mac.rs): compile check only, there is no
  # Mac hardware in the loop yet.
  build-macos:
    name: Build (macOS, experimental)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (release)
        run: cargo build --release --verbose
      - name: Tests
        run: cargo test --verbose

  audit:
    name: Dependency audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        run: cargo audit
